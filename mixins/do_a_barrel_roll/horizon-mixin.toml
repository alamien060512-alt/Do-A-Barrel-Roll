[mod]
id = "do_a_barrel_roll"
version = "0.1.0"
priority = 100

# The commit it was tested on. The turn and camera hooks below target the game's
# own functions (not only the documented hook points), so they build on this
# commit and need re-checking on a newer one.
[compatibility]
horizon_revision = "c1f4a7c1968b035596d0cae9985fa154cb5bda41"

# runtime.rs becomes the module crate::game::barrel_roll.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "barrel_roll"
source = "runtime.rs"

# Every frame: ease the roll, apply the banked turn and A / D yaw.
[[injection]]
id = "frame"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_frame"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "elapsed", ty = "std::time::Duration", value = "elapsed" },
]

# The mouse turns the player: while gliding, sideways movement rolls the wing
# and only the vertical movement reaches the game's own turn.
[[injection]]
id = "turn"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::perspective::Game<'_>::turn_player"
helper = "turn.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "xo", ty = "f64", value = "xo" },
  { name = "yo", ty = "f64", value = "yo" },
]

# The camera: the nausea / portal spin matrix gains the roll. The view is
# bob * spin * rotation, so a turn about the view's own axis is a camera roll.
[[injection]]
id = "camera"
kind = "RETURN"
target = "horizon_client::game::fov::Game<'_>::spinning_matrix"
helper = "camera.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "value", ty = "glam::Mat4", value = "$value" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]
